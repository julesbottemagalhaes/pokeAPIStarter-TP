<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poke API</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h2>Sélectionner la génération de Pokémon :</h2>
    <section id="filtre">
      <div class="select">
        <select id="generation" aria-label="Génération de Pokémon">
          <option value="1">Génération 1</option>
          <option value="2">Génération 2</option>
          <option value="3">Génération 3</option>
          <option value="4">Génération 4</option>
          <option value="5">Génération 5</option>
          <option value="6">Génération 6</option>
          <option value="7">Génération 7</option>
          <option value="8">Génération 8</option>
          <option value="9">Génération 9</option>
        </select>
      </div>
      <label class="sort-label" for="language">Langue du nom des Pokémon :</label>
      <div class="select">
        <select id="language">
          <option value="fr">Français</option>
          <option value="en">Anglais</option>
          <option value="jp">Japonais</option>
        </select>
      </div>
      <label class="sort-label" for="sort">Trier les Pokémon par :</label>
      <div class="select">
        <select id="sort">
          <option value="name">Nom (A à Z)</option>
          <option value="hp">Points de vie (décroissant)</option>
          <option value="attack">Attaque (décroissant)</option>
          <option value="defense">Défense (décroissant)</option>
          <option value="special_attack">Attaque spéciale (décroissant)</option>
          <option value="special_defense">Défense spéciale (décroissant)</option>
          <option value="speed">Vitesse (décroissant)</option>
          <option value="type">Type (A à Z)</option>
        </select>
      </div>
      <h2 class="types-title">Filtrer par type :</h2>
      <div id="types" role="group" aria-label="Types de Pokémon"></div>
    </section>

    <main aria-live="polite"></main>
    <footer>Données fournies par <a href="https://tyradex.app">Tyradex</a>.</footer>
    <script type="module" src="./js/script.js"></script>
  </body>
</html>
